[project]
name = "paypal-ai-hackathon"
version = "0.1.0"
description = "PayPal AI Hackathon 2026 project: PayPal developer platform + Claude"
readme = "README.md"
authors = [
    { name = "satwik1sharma", email = "satwik.prof@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "anthropic>=1.15.0",
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openinference-instrumentation-anthropic>=3.0.3",
    "paypal-agent-toolkit>=1.11.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "rich>=13.9.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
paypal-ai-hackathon = "paypal_ai_hackathon:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real PayPal sandbox / Claude APIs (deselect with -m 'not live')"]
